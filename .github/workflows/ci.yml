name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install backend dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Lint frontend
        run: npm run lint --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Check backend JavaScript syntax
        run: |
          node --check backend/server.js
          node --check backend/app.js
          node --check backend/controllers/resourceController.js
          node --check backend/routes/resourceRoutes.js
          node --check backend/routes/seoRoutes.js
